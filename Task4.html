<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Add New Task</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f5f5f5;
            color: #333;
        }

        h1, h2 {
            color: #8b4a3c;
        }

        .task-form, .tasks-section {
            background-color: white;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid #ddd;
            border-radius: 6px;
            max-width: 900px;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"], input[type="date"], select, textarea {
            width: 100%;
            max-width: 500px;
            padding: 8px;
            border: 1px solid #bbb;
            border-radius: 4px;
            box-sizing: border-box;
        }

        textarea {
            height: 75px;
            resize: vertical;
        }

        .category-options label {
            display: inline-block;
            margin-right: 12px;
            font-weight: normal;
        }

        button {
            padding: 9px 16px;
            margin-top: 15px;
            margin-right: 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .add-button {
            background-color: #a95745;
            color: white;
        }

        .reset-button {
            background-color: #777;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background-color: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #eee;
        }

        .search-box {
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .search-box input {
            padding: 8px;
            width: 250px;
            max-width: 100%;
        }
    </style>
</head>
<body>
    <h1>Add New Task</h1>

    <div class="task-form">
        <form>
            <label for="taskName">Task Name</label>
            <input type="text" id="taskName" name="taskName" placeholder="Enter task name">

            <label>Category</label>
            <div class="category-options">
                <label><input type="radio" name="category" value="Work"> Work</label>
                <label><input type="radio" name="category" value="Personal"> Personal</label>
                <label><input type="radio" name="category" value="Study"> Study</label>
                <label><input type="radio" name="category" value="Shopping"> Shopping</label>
            </div>

            <label for="priority">Priority</label>
            <select id="priority" name="priority">
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>

            <label for="dueDate">Due Date</label>
            <input type="date" id="dueDate" name="dueDate">

            <label for="description">Description</label>
            <textarea id="description" name="description" placeholder="Enter task description"></textarea>

            <br>
            <button class="add-button" type="button">Add Task</button>
            <button class="reset-button" type="reset">Reset</button>
        </form>
    </div>

    <div class="tasks-section">
        <h2>Your Tasks</h2>

        <div class="search-box">
            <label for="searchTask">Search Tasks</label>
            <input type="text" id="searchTask" placeholder="Search tasks...">
        </div>

        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Task</th>
                    <th>Category</th>
                    <th>Priority</th>
                    <th>Due Date</th>
                    <th>Description</th>
                    <th>Update</th>
                    <th>Delete</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Study HTML Forms</td>
                    <td>Study</td>
                    <td>High</td>
                    <td>2026-10-30</td>
                    <td>Review form elements</td>
                    <td><button type="button">Update</button></td>
                    <td><button type="button">Delete</button></td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Complete Assignment</td>
                    <td>Study</td>
                    <td>Medium</td>
                    <td>2026-11-02</td>
                    <td>Complete the HTML assignment</td>
                    <td><button type="button">Update</button></td>
                    <td><button type="button">Delete</button></td>
                </tr>
            </tbody>
        </table>
    </div>

    <p>&copy; 2026 Task Manager</p>
</body>
</html>
